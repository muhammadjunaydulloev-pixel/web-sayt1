{% extends "base.html" %}
{% block title %}Чат бо админ — 1300 Луғат{% endblock %}
{% block content %}
<div class="wrap-narrow">
  <a href="/chat" class="back-link">← Чат</a>
  <h1>Чат бо админ</h1>
  <p style="color:var(--plum-soft); margin-top:-8px;">Саволе доред? Дар ин ҷо бевосита ба админ нависед.</p>

  <div class="chat-shell">
    <div id="chat-messages" class="chat-messages">
      <p class="chat-empty">Паём нест. Ба админ нависед!</p>
    </div>
    <form id="chat-form" class="chat-form">
      <input type="text" id="chat-input" name="message" placeholder="Паёмро нависед…" maxlength="2000" autocomplete="off" required>
      <button type="submit" class="btn btn-primary btn-sm">Фиристодан</button>
    </form>
  </div>
</div>

<script>
let lastId = 0;
const box = document.getElementById('chat-messages');
let firstLoad = true;

function esc(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderMessage(m){
  const mine = m.sender === 'user';
  const wrap = document.createElement('div');
  wrap.className = 'chat-msg' + (mine ? ' mine' : ' admin-msg');
  const nameLabel = mine ? 'Шумо' : '👑 Админ';
  wrap.innerHTML = `
    <div class="bubble">
      <div class="meta">${nameLabel}</div>
      <div class="text">${esc(m.message)}</div>
    </div>
  `;
  box.appendChild(wrap);
}

async function poll(){
  try{
    const res = await fetch('/api/chat/admin/messages?after_id=' + lastId);
    const data = await res.json();
    if(data.messages.length){
      if(firstLoad) box.innerHTML = '';
      data.messages.forEach(m => { renderMessage(m); lastId = m.id; });
      firstLoad = false;
      box.scrollTop = box.scrollHeight;
    }
  }catch(e){ /* network hiccup, will retry */ }
}

document.getElementById('chat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  const form = new FormData();
  form.append('message', text);
  await fetch('/api/chat/admin/send', { method: 'POST', body: form });
  await poll();
});

poll();
setInterval(poll, 3000);
</script>
{% endblock %}
