{% extends "base.html" %}
{% block content %}
<div class="wrap">
  <h1 style="margin-top:20px;">Панели админ</h1>
  <div class="admin-shell">
    <nav class="admin-nav">
      <a href="/admin" class="{% if active == 'dashboard' %}active{% endif %}">📊 Умумӣ</a>
      <a href="/admin/users" class="{% if active == 'users' %}active{% endif %}">👥 Корбарон</a>
      <a href="/admin/payments" class="{% if active == 'payments' %}active{% endif %}">💳 Пардохтҳо</a>
      <a href="/admin/dictionary" class="{% if active == 'dictionary' %}active{% endif %}">📚 Луғатҳо</a>
      <a href="/admin/certificates" class="{% if active == 'certificates' %}active{% endif %}">🏆 Сертификатҳо</a>
      <a href="/admin/chat" class="{% if active == 'chat' %}active{% endif %}">
        💬 Чат
        {% set au = nav_admin_chat_unread(request) %}
        {% if au %}<span class="nav-badge">{{ au }}</span>{% endif %}
      </a>
      <a href="/chat" class="{% if active == 'group' %}active{% endif %}">🌐 Чати гурӯҳӣ</a>
    </nav>
    <div>
      {% block admin_content %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
